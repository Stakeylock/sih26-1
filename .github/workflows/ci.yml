name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  demo-quality:
    name: Demo quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and verify the demo bundle
        run: npm run build

      - name: Run database and automation tests
        run: npm test

      - name: Audit application dependencies
        run: npm audit --audit-level=high

      - name: Install the Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Prepare demo screenshot directory
        run: mkdir -p ../../work

      - name: Run demo browser tests
        run: npm run test:e2e
